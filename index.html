<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Interval Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--text:#f1f5f9;--mute:#94a3b8;--acc:#38bdf8;--danger:#f87171;--c:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI","Noto Sans Thai",sans-serif}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--card2);cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--acc);color:#04202e;font-weight:700}
button.danger{background:transparent;color:var(--danger)}
input,select{font:inherit;color:inherit;background:var(--card2);border:1px solid #334155;border-radius:10px;padding:9px 10px;min-width:0}
input:focus{outline:2px solid var(--acc)}
.screen{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.4rem;margin:0}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.card .info{flex:1;min-width:0}
.card .name{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{color:var(--mute);font-size:.85rem;margin-top:2px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;gap:1px}
.bar i{display:block}
.play{width:52px;height:52px;border-radius:50%;padding:0;font-size:1.3rem;flex:none}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ivl{background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px}
.ivl .row:last-child{margin-bottom:0}
.dot{width:34px;height:34px;border-radius:50%;padding:0;flex:none;border:2px solid #fff3}
label.l{display:block;color:var(--mute);font-size:.8rem;margin:12px 0 4px}
.num{width:64px;text-align:center}
.sm{padding:6px 10px;font-size:.9rem}
#run{position:fixed;inset:0;background:color-mix(in srgb,var(--c) 38%,#0b1220);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));transition:background .3s;text-align:center}
#run .top{width:100%;display:flex;justify-content:space-between;align-items:center;color:#fffc}
#rName{font-size:clamp(1.6rem,7vw,2.6rem);font-weight:800;letter-spacing:.02em}
#rTime{font-size:clamp(5rem,28vw,9.5rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#rSub{color:#fffb;font-size:1.05rem}
.prog{width:100%;height:10px;background:#0004;border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff}
.ctrls{display:flex;gap:14px;align-items:center;justify-content:center}
.ctrls button{background:#0005;width:60px;height:60px;border-radius:50%;padding:0;font-size:1.3rem}
.ctrls button.big{width:84px;height:84px;background:#fff;color:#111;font-size:2rem}
#picker{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
#picker .screen{padding-top:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
.tabs button.on{background:var(--acc);color:#04202e;font-weight:700}
.chk{width:40px;height:40px;border-radius:50%;padding:0;flex:none;border:2px solid #475569;background:transparent}
.chk.on{background:#22c55e;border-color:#22c55e;color:#052e16;font-weight:800}
.today{outline:2px solid var(--acc)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.exl{margin:8px 0 0;padding:0;list-style:none;font-size:.9rem}
.exl li{padding:5px 0;border-top:1px solid #334155}
.exl small{display:block;color:var(--mute)}
.grp{margin-bottom:6px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;position:sticky;top:0;background:var(--bg)}
.chip{flex:none;padding:6px 14px;border-radius:99px;font-size:.9rem}
.chip.on{background:var(--acc);color:#04202e;font-weight:700}
.ex{display:block;width:100%;text-align:left;background:var(--card);margin-bottom:8px;padding:12px 14px}
.ex b{display:block}
.ex span{color:var(--mute);font-size:.85rem}
[hidden]{display:none!important}
.empty{color:var(--mute);text-align:center;padding:30px 0}
</style>
</head>
<body>

<!-- รายการ -->
<div id="home" class="screen">
  <header><h1>⏱ Interval Timer</h1><button class="primary" id="btnNew">+ สร้างใหม่</button></header>
  <div class="tabs"><button id="tabT" class="on">⏱ ไทเมอร์</button><button id="tabP">📅 แผนสัปดาห์</button></div>
  <div id="list"></div>
  <div id="plan" hidden></div>
</div>

<!-- แก้ไข -->
<div id="edit" class="screen" hidden>
  <header><h1 id="eTitle">ตั้งค่าไทเมอร์</h1><button id="btnBack">← กลับ</button></header>
  <label class="l">ชื่อ</label>
  <input id="eName" style="width:100%" placeholder="เช่น Tabata">
  <label class="l">จำนวนรอบ (ทำซ้ำชุด interval ทั้งหมด)</label>
  <input id="eSets" type="number" min="1" max="99" class="num">
  <label class="l">Interval</label>
  <div id="eRows"></div>
  <button id="btnAdd" style="width:100%;margin-bottom:16px">+ เพิ่ม interval</button>
  <div class="row"><button class="primary" id="btnSave" style="flex:1">บันทึก</button><button class="primary" id="btnSaveRun" style="flex:1;background:#4ade80">บันทึกและเริ่ม</button></div>
  <div class="row" style="margin-top:6px"><button id="btnDup" style="flex:1">คัดลอก</button><button class="danger" id="btnDel" style="flex:1">ลบ</button></div>
</div>

<!-- จับเวลา -->
<div id="run" hidden>
  <div class="top"><span id="rSet"></span><span><button class="sm" id="btnSound" style="background:#0004">🔊</button> <button class="sm" id="btnStop" style="background:#0004">✕ ปิด</button></span></div>
  <div>
    <div id="rName"></div>
    <div id="rMuscle" style="margin-top:6px;font-size:1.1rem;color:#fffd"></div>
    <div id="rTime">0:00</div>
    <div id="rSub"></div>
    <div id="rWake" style="margin-top:10px;font-size:.8rem;color:#fff9"></div>
  </div>
  <div style="width:100%">
    <div class="prog"><i id="rProg"></i></div>
    <div class="ctrls" style="margin-top:18px">
      <button id="btnPrev">⏮</button>
      <button id="btnPause" class="big">⏸</button>
      <button id="btnNext">⏭</button>
    </div>
  </div>
</div>

<!-- เลือกท่า -->
<div id="picker" hidden>
  <div class="screen">
    <header><h1>เลือกท่าออกกำลังกาย</h1><button id="pClose">✕ ปิด</button></header>
    <input id="pSearch" placeholder="ค้นหา เช่น squat, อก, ขา" style="width:100%">
    <div class="chips" id="pChips"></div>
    <div id="pList"></div>
  </div>
</div>

<script>
const COLORS=['#22c55e','#ef4444','#3b82f6','#f59e0b','#a855f7','#14b8a6','#ec4899'];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const iv=(name,sec,ci,muscle='')=>({name,sec,color:COLORS[ci],muscle});

/* [หมวด, ชื่อท่า, ส่วนที่ได้] */
const EX=[
['อก','วิดพื้น (Push-up)','อกใหญ่ · ไหล่หน้า · ไตรเซ็ปส์'],
['อก','วิดพื้นมือชิด (Diamond Push-up)','ไตรเซ็ปส์ · อกส่วนใน'],
['อก','วิดพื้นเท้าสูง (Decline Push-up)','อกส่วนบน · ไหล่หน้า'],
['อก','วิดพื้นคุกเข่า (Knee Push-up)','อกใหญ่ · ไตรเซ็ปส์ (ระดับเริ่มต้น)'],
['อก','ดิปเก้าอี้ (Bench Dip)','ไตรเซ็ปส์ · อกส่วนล่าง'],
['หลัง','ซูเปอร์แมน (Superman)','หลังส่วนล่าง · ก้น'],
['หลัง','ดึงข้อ (Pull-up)','ปีกหลัง · ไบเซ็ปส์'],
['หลัง','ก้มพายเรือ (Bent-over Row)','หลังส่วนกลาง · ปีกหลัง · ไบเซ็ปส์'],
['หลัง','ก้มกางแขน (Reverse Fly)','ไหล่หลัง · สะบัก'],
['หลัง','ยกแขนขาสลับนอนคว่ำ (Bird Dog)','หลังส่วนล่าง · แกนกลางลำตัว'],
['ไหล่','พุชอัพก้นสูง (Pike Push-up)','ไหล่ · ไตรเซ็ปส์'],
['ไหล่','ดัมเบลเพรสไหล่ (Shoulder Press)','ไหล่ · ไตรเซ็ปส์'],
['ไหล่','ยกแขนด้านข้าง (Lateral Raise)','ไหล่ด้านข้าง'],
['ไหล่','หมุนแขน (Arm Circles)','ไหล่ · วอร์มอัพ'],
['แขน','ไบเซ็ปส์เคิร์ล (Bicep Curl)','ไบเซ็ปส์ · ปลายแขน'],
['แขน','แฮมเมอร์เคิร์ล (Hammer Curl)','ไบเซ็ปส์ · ปลายแขน'],
['แขน','ไตรเซ็ปส์เอ็กซ์เทนชัน (Tricep Extension)','ไตรเซ็ปส์'],
['แขน','แพลงก์ขึ้นลง (Plank Up-Down)','ไตรเซ็ปส์ · ไหล่ · แกนกลางลำตัว'],
['ขา','สควอช (Squat)','ต้นขาหน้า · ก้น · ต้นขาหลัง'],
['ขา','สควอชกระโดด (Jump Squat)','ต้นขา · ก้น · น่อง · หัวใจ'],
['ขา','ซูโม่สควอช (Sumo Squat)','ต้นขาด้านใน · ก้น'],
['ขา','ลันจ์ (Lunge)','ต้นขาหน้า · ก้น'],
['ขา','ลันจ์ถอยหลัง (Reverse Lunge)','ก้น · ต้นขาหลัง · ต้นขาหน้า'],
['ขา','บัลแกเรียนสปลิตสควอช (Bulgarian Split Squat)','ต้นขาหน้า · ก้น'],
['ขา','นั่งพิงกำแพง (Wall Sit)','ต้นขาหน้า · ก้น'],
['ขา','เขย่งปลายเท้า (Calf Raise)','น่อง'],
['ขา','ก้าวขึ้นบันได (Step-up)','ต้นขา · ก้น · น่อง'],
['ก้น','ยกสะโพก (Glute Bridge)','ก้น · ต้นขาหลัง'],
['ก้น','ฮิปทรัสต์ (Hip Thrust)','ก้น · ต้นขาหลัง'],
['ก้น','เตะก้นขึ้น (Donkey Kick)','ก้น'],
['ก้น','ยกขาด้านข้างคุกเข่า (Fire Hydrant)','ก้นด้านข้าง · สะโพก'],
['หน้าท้อง','แพลงก์ (Plank)','หน้าท้องทั้งหมด · แกนกลางลำตัว · ไหล่'],
['หน้าท้อง','แพลงก์ด้านข้าง (Side Plank)','หน้าท้องด้านข้าง · เอว'],
['หน้าท้อง','ครันช์ (Crunch)','หน้าท้องส่วนบน'],
['หน้าท้อง','ซิทอัพ (Sit-up)','หน้าท้อง · สะโพกด้านหน้า'],
['หน้าท้อง','ครันช์จักรยาน (Bicycle Crunch)','หน้าท้อง · ด้านข้างลำตัว'],
['หน้าท้อง','ยกขา (Leg Raise)','หน้าท้องส่วนล่าง'],
['หน้าท้อง','รัสเซียนทวิสต์ (Russian Twist)','หน้าท้องด้านข้าง · เอว'],
['หน้าท้อง','ปีนเขา (Mountain Climber)','หน้าท้อง · ไหล่ · ขา · หัวใจ'],
['หน้าท้อง','เดดบัค (Dead Bug)','แกนกลางลำตัว · หน้าท้องส่วนล่าง'],
['คาร์ดิโอ','กระโดดตบ (Jumping Jack)','ทั้งตัว · หัวใจ'],
['คาร์ดิโอ','วิ่งยกเข่าสูง (High Knees)','ต้นขา · น่อง · หน้าท้อง · หัวใจ'],
['คาร์ดิโอ','เบอร์พี (Burpee)','ทั้งตัว · หัวใจ'],
['คาร์ดิโอ','วิ่งเตะก้น (Butt Kicks)','ต้นขาหลัง · น่อง · หัวใจ'],
['คาร์ดิโอ','กระโดดสเก็ต (Skater Jump)','ขา · ก้น · ทรงตัว · หัวใจ'],
['คาร์ดิโอ','กระโดดเชือก (Jump Rope)','น่อง · ไหล่ · หัวใจ'],
['คาร์ดิโอ','ชกลม (Shadow Boxing)','ไหล่ · แขน · แกนกลางลำตัว · หัวใจ'],
['คาร์ดิโอ','วิ่งอยู่กับที่ (Run in Place)','ขา · หัวใจ'],
['ยืดเหยียด','ยืดต้นขาหน้า (Quad Stretch)','ต้นขาหน้า'],
['ยืดเหยียด','ยืดต้นขาหลัง (Hamstring Stretch)','ต้นขาหลัง · หลังส่วนล่าง'],
['ยืดเหยียด','ยืดไหล่ (Shoulder Stretch)','ไหล่ · สะบัก'],
['ยืดเหยียด','ท่าเด็ก (Child\'s Pose)','หลัง · สะโพก · ไหล่'],
['ยืดเหยียด','ยืดสะโพก (Hip Flexor Stretch)','สะโพกด้านหน้า · ต้นขาหน้า'],
['อก','ดัมเบลเพรสนอนพื้น (Dumbbell Floor Press)','อกใหญ่ · ไตรเซ็ปส์ · ไหล่หน้า'],
['หลัง','พายเรือดัมเบลข้างเดียว (One-arm Dumbbell Row)','หลังส่วนกลาง · ปีกหลัง · ไบเซ็ปส์'],
['หลัง','โรมาเนียนเดดลิฟต์ดัมเบล (Dumbbell Romanian Deadlift)','ต้นขาหลัง · ก้น · หลังส่วนล่าง'],
['ไหล่','ยักไหล่ดัมเบล (Dumbbell Shrug)','กล้ามเนื้อบ่า · ต้นคอ'],
['ขา','ก็อบเล็ตสควอช (Goblet Squat)','ต้นขาหน้า · ก้น · แกนกลางลำตัว'],
['ขา','ลันจ์ถือดัมเบล (Dumbbell Lunge)','ต้นขาหน้า · ก้น · ต้นขาหลัง'],
['ก้น','ฮิปทรัสต์ถือดัมเบล (Dumbbell Hip Thrust)','ก้น · ต้นขาหลัง'],
['คาร์ดิโอ','ดัมเบลทรัสเตอร์ (Dumbbell Thruster)','ทั้งตัว · ต้นขา · ไหล่ · หัวใจ'],
['พัก','พัก (Rest)',''],
];
const CATS=['ทั้งหมด',...new Set(EX.map(e=>e[0]))];

let presets=store.get('tp_presets',null)||[
  {id:uid(),name:'Tabata',sets:8,intervals:[iv('ออกแรง',20,1),iv('พัก',10,0)]},
  {id:uid(),name:'HIIT 30/15',sets:10,intervals:[iv('ออกแรง',30,1),iv('พัก',15,0)]},
  {id:uid(),name:'ชกมวย 3 ยก',sets:3,intervals:[iv('ยก',180,1),iv('พัก',60,0)]},
  {id:uid(),name:'Pomodoro',sets:4,intervals:[iv('โฟกัส',1500,2),iv('พัก',300,0)]},
];
let soundOn=store.get('tp_sound',true);
const save=()=>store.set('tp_presets',presets);
const sumSec=a=>(a||[]).reduce((x,i)=>x+i.sec,0);
const total=p=>p.sets*sumSec(p.intervals)+sumSec(p.warm)+sumSec(p.cool);

function show(name){['home','edit','run'].forEach(n=>$(n).hidden=n!==name)}

/* ---------- รายการ ---------- */
function renderList(){
  const el=$('list');
  if(!presets.length){el.innerHTML='<div class="empty">ยังไม่มีไทเมอร์ กด "+ สร้างใหม่"</div>';return}
  el.innerHTML=presets.map(p=>{
    const t=total(p);
    const bar=p.intervals.map(i=>`<i style="flex:${i.sec};background:${i.color}"></i>`).join('');
    return `<div class="card" data-id="${p.id}">
      <div class="info" data-edit><div class="name">${esc(p.name)}</div>
      <div class="meta">${p.sets} รอบ · ${p.intervals.length} interval · รวม ${fmt(t)} นาที</div>
      <div class="bar">${bar}</div></div>
      <button class="primary play" data-play>▶</button></div>`}).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('list').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const p=presets.find(x=>x.id===card.dataset.id);
  if(e.target.closest('[data-play]'))startRun(p);
  else openEdit(p);
});
$('btnNew').onclick=()=>openEdit(null);

/* ---------- แก้ไข ---------- */
let draft=null,isNew=false;
function openEdit(p){
  isNew=!p;
  draft=p?JSON.parse(JSON.stringify(p)):{id:uid(),name:'',sets:1,intervals:[iv('ออกแรง',30,1),iv('พัก',10,0)]};
  $('eTitle').textContent=isNew?'สร้างไทเมอร์':'แก้ไขไทเมอร์';
  $('eName').value=draft.name;$('eSets').value=draft.sets;
  $('btnDup').hidden=$('btnDel').hidden=isNew;
  renderRows();show('edit');window.scrollTo(0,0);
}
function renderRows(){
  $('eRows').innerHTML=draft.intervals.map((it,i)=>`<div class="ivl" data-i="${i}">
    <div class="row"><button class="dot" data-color style="background:${it.color}"></button>
      <input data-f="name" value="${esc(it.name)}" style="flex:1" placeholder="ชื่อ">
      <button class="sm" data-up ${i==0?'disabled':''}>↑</button><button class="sm" data-down ${i==draft.intervals.length-1?'disabled':''}>↓</button>
      <button class="sm danger" data-rm ${draft.intervals.length<2?'disabled':''}>🗑</button></div>
    <div class="row"><button class="sm" data-pick>📋 เลือกท่า</button>
      <input data-f="muscle" value="${esc(it.muscle||'')}" style="flex:1" placeholder="ส่วนที่ได้ (ไม่บังคับ)"></div>
    <div class="row"><input data-f="m" type="number" min="0" max="999" class="num" value="${Math.floor(it.sec/60)}"> นาที
      <input data-f="s" type="number" min="0" max="59" class="num" value="${it.sec%60}"> วินาที</div></div>`).join('');
}
$('eRows').addEventListener('input',e=>{
  const row=e.target.closest('.ivl');if(!row)return;
  const it=draft.intervals[+row.dataset.i],f=e.target.dataset.f;
  if(f==='name')it.name=e.target.value;
  else if(f==='muscle')it.muscle=e.target.value;
  else{const m=+row.querySelector('[data-f=m]').value||0,s=+row.querySelector('[data-f=s]').value||0;it.sec=m*60+s}
});
$('eRows').addEventListener('click',e=>{
  const row=e.target.closest('.ivl');if(!row)return;
  const i=+row.dataset.i,a=draft.intervals;
  if(e.target.closest('[data-color]')){a[i].color=COLORS[(COLORS.indexOf(a[i].color)+1)%COLORS.length]}
  else if(e.target.closest('[data-up]')&&i>0){[a[i-1],a[i]]=[a[i],a[i-1]]}
  else if(e.target.closest('[data-down]')&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]]}
  else if(e.target.closest('[data-rm]')&&a.length>1){a.splice(i,1)}
  else if(e.target.closest('[data-pick]')){openPicker(i);return}
  else return;
  renderRows();
});

/* ---------- เลือกท่า ---------- */
let pickIdx=0,pickCat='ทั้งหมด';
function openPicker(i){pickIdx=i;pickCat='ทั้งหมด';$('pSearch').value='';renderPicker();$('picker').hidden=false;$('picker').scrollTop=0}
function renderPicker(){
  $('pChips').innerHTML=CATS.map(c=>`<button class="chip ${c===pickCat?'on':''}" data-cat="${c}">${c}</button>`).join('');
  const q=$('pSearch').value.trim().toLowerCase();
  const rows=EX.map((e,n)=>[e,n]).filter(([e])=>(pickCat==='ทั้งหมด'||e[0]===pickCat)&&(!q||(e[0]+e[1]+e[2]).toLowerCase().includes(q)));
  $('pList').innerHTML=rows.length?rows.map(([e,n])=>`<button class="ex" data-n="${n}"><b>${esc(e[1])}</b><span>${e[2]?'💪 '+esc(e[2]):'ช่วงพักฟื้น'}</span></button>`).join(''):'<div class="empty">ไม่พบท่าที่ค้นหา</div>';
}
$('pChips').addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){pickCat=c.dataset.cat;renderPicker()}});
$('pSearch').addEventListener('input',renderPicker);
$('pList').addEventListener('click',e=>{
  const b=e.target.closest('[data-n]');if(!b)return;
  const ex=EX[+b.dataset.n],it=draft.intervals[pickIdx];
  it.name=ex[1];it.muscle=ex[2];
  $('picker').hidden=true;renderRows();
});
$('pClose').onclick=()=>{$('picker').hidden=true};
$('btnAdd').onclick=()=>{const n=draft.intervals.length;draft.intervals.push(iv('Interval '+(n+1),30,n%COLORS.length));renderRows()};
$('btnBack').onclick=()=>{renderList();show('home')};
function commit(){
  draft.name=$('eName').value.trim()||'ไม่มีชื่อ';
  draft.sets=Math.max(1,Math.min(99,+$('eSets').value||1));
  if(draft.intervals.some(i=>i.sec<1)){alert('ทุก interval ต้องยาวอย่างน้อย 1 วินาที');return false}
  const idx=presets.findIndex(p=>p.id===draft.id);
  if(idx>=0)presets[idx]=draft;else presets.push(draft);
  save();return true;
}
$('btnSave').onclick=()=>{if(commit()){renderList();show('home')}};
$('btnSaveRun').onclick=()=>{if(commit()){renderList();startRun(draft)}};
$('btnDup').onclick=()=>{const c=JSON.parse(JSON.stringify(draft));c.id=uid();c.name=($('eName').value.trim()||draft.name)+' (สำเนา)';presets.push(c);save();renderList();show('home')};
$('btnDel').onclick=()=>{if(confirm('ลบ "'+draft.name+'" ?')){presets=presets.filter(p=>p.id!==draft.id);save();renderList();show('home')}};

/* ---------- เสียง ---------- */
let ac=null;
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(freq,dur,vol=.35){
  if(!soundOn||!ac)return;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setSoundIcon(){$('btnSound').textContent=soundOn?'🔊':'🔇'}
$('btnSound').onclick=()=>{soundOn=!soundOn;store.set('tp_sound',soundOn);setSoundIcon()};

/* ---------- จับเวลา ---------- */
let run=null,timer=null,wake=null;
function build(p){
  const s=[],mk=(i,set,phase,pos,cnt)=>s.push({name:i.name,sec:i.sec,color:i.color,muscle:i.muscle||'',set,phase,pos,cnt});
  (p.warm||[]).forEach((i,j)=>mk(i,0,'warm',j+1,p.warm.length));
  for(let k=1;k<=p.sets;k++)p.intervals.forEach((i,j)=>mk(i,k,'main',j+1,p.intervals.length));
  (p.cool||[]).forEach((i,j)=>mk(i,0,'cool',j+1,p.cool.length));
  return s;
}
let wakeErr='',wakeTry=0;
async function lockScreen(){
  if(wake||document.hidden)return;
  if(!('wakeLock' in navigator)){wakeErr='เบราว์เซอร์ไม่รองรับ';updWake();return}
  try{wake=await navigator.wakeLock.request('screen');wakeErr='';wake.addEventListener('release',()=>{wake=null;updWake()})}
  catch(e){wake=null;wakeErr=e.name+(e.message?': '+e.message:'')}
  updWake();
}
function updWake(){const el=$('rWake');if(el)el.textContent=wake?'🔒 จอไม่ดับ':'⚠ จอดับได้'+(wakeErr?' ('+wakeErr+')':'')}
document.addEventListener('visibilitychange',()=>{if(run&&!document.hidden)lockScreen()});

function startRun(p){
  initAudio();setSoundIcon();
  run={p,steps:build(p),i:0,end:0,left:0,paused:false,last:null,done:false};
  show('run');updWake();lockScreen();
  enterStep(0,true);
  clearInterval(timer);timer=setInterval(tick,100);
}
function enterStep(i,silent){
  run.i=i;const s=run.steps[i];
  run.left=s.sec*1000;run.end=Date.now()+run.left;run.last=null;
  $('run').style.setProperty('--c',s.color);
  $('rName').textContent=s.name;
  $('rMuscle').textContent=s.muscle?'💪 '+s.muscle:'';
  $('rSet').textContent=s.phase==='warm'?`วอร์มอัพ ${s.pos}/${s.cnt}`:s.phase==='cool'?`คูลดาวน์ ${s.pos}/${s.cnt}`:`รอบ ${s.set}/${run.p.sets} · ${s.pos}/${s.cnt}`;
  if(!silent){beep(1320,.45,.5);vib(200)}
  draw();
}
function draw(){
  const s=run.steps[run.i];
  $('rTime').textContent=fmt(run.left/1000);
  $('rProg').style.width=(100-run.left/(s.sec*1000)*100)+'%';
  const rest=run.steps.slice(run.i+1).reduce((a,x)=>a+x.sec,0)+run.left/1000;
  const nxt=run.steps[run.i+1];
  $('rSub').textContent=(nxt?'ถัดไป: '+nxt.name+' · ':'')+'เหลือรวม '+fmt(rest);
}
function tick(){
  if(!run||run.paused||run.done)return;
  const left=run.end-Date.now();
  if(left<=0){
    if(run.i+1>=run.steps.length)return finish();
    return enterStep(run.i+1);
  }
  run.left=left;
  if(!wake&&++wakeTry%50===0)lockScreen();
  const sec=Math.ceil(left/1000);
  if(sec<=3&&sec!==run.last){run.last=sec;beep(880,.12);vib(40)}
  draw();
}
function finish(){
  run.done=true;run.left=0;
  if(run.p.planDay!=null){markDone(run.p.planDay,true)}
  $('rName').textContent='เสร็จแล้ว! 🎉';$('rMuscle').textContent='';$('rTime').textContent='0:00';$('rSub').textContent='';
  $('rProg').style.width='100%';$('btnPause').textContent='↺';
  $('run').style.setProperty('--c','#22c55e');
  [0,.22,.44].forEach(d=>setTimeout(()=>beep(1320,.2,.5),d*1000));vib([200,100,200,100,400]);
}
function stop(){
  clearInterval(timer);run=null;
  try{wake&&wake.release()}catch(e){}
  wake=null;
  $('btnPause').textContent='⏸';
  renderList();renderPlan();show('home');
}
$('btnStop').onclick=stop;
$('btnPause').onclick=()=>{
  if(run.done){const p=run.p;startRun(p);$('btnPause').textContent='⏸';return}
  run.paused=!run.paused;
  if(run.paused){run.left=run.end-Date.now()}else{run.end=Date.now()+run.left}
  $('btnPause').textContent=run.paused?'▶':'⏸';
};
$('btnNext').onclick=()=>{if(run.done)return;run.paused=false;$('btnPause').textContent='⏸';run.i+1>=run.steps.length?finish():enterStep(run.i+1)};
$('btnPrev').onclick=()=>{
  if(run.done){run.done=false;$('btnPause').textContent='⏸';enterStep(run.steps.length-1);return}
  const elapsed=run.steps[run.i].sec*1000-run.left;
  run.paused=false;$('btnPause').textContent='⏸';
  enterStep(elapsed>2000?run.i:Math.max(0,run.i-1));
};
document.addEventListener('keydown',e=>{
  if(!run||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();$('btnPause').click()}
  else if(e.code==='ArrowRight')$('btnNext').click();
  else if(e.code==='ArrowLeft')$('btnPrev').click();
  else if(e.code==='Escape')stop();
});

/* ---------- แผนรายสัปดาห์ ---------- */
const WEEK=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'],WORK=[0,1,2,4,5];
const GOALS={
  muscle:{name:'เพิ่มกล้ามเนื้อ',desc:'แบ่งกลุ่มกล้ามเนื้อวันละส่วน ทำหลายรอบ พักสั้น-กลาง',p:{beg:[30,30,3],int:[40,20,4]}},
  fat:{name:'ลดไขมัน',desc:'HIIT และวงจรทั้งตัว ชีพจรสูง สลับกับวันคาร์ดิโอเบา',p:{beg:[30,30,3],int:[40,20,4]}},
  strength:{name:'เพิ่มความแข็งแรง',desc:'ท่าหลักขา-ดัน-ดึง ทำช้าและคุมท่า พักนานขึ้น',p:{beg:[30,45,3],int:[30,60,4]}},
};
const DAYS={
muscle:[
{t:['อก + ไตรเซ็ปส์','อก + ไตรเซ็ปส์'],bw:['Push-up','Decline Push-up','Diamond Push-up','Bench Dip','Plank Up-Down'],db:['Dumbbell Floor Press','Push-up','Tricep Extension','Bench Dip','Plank Up-Down'],cool:'u'},
{t:['หลัง + แกนกลาง','หลัง + ไบเซ็ปส์'],bw:['Superman','Reverse Fly','Bird Dog','Plank','Dead Bug'],db:['One-arm Dumbbell Row','Bent-over Row','Reverse Fly','Bicep Curl','Hammer Curl'],cool:'u'},
{t:['ขา + ก้น','ขา + ก้น'],bw:['Squat','Bulgarian Split Squat','Reverse Lunge','Glute Bridge','Calf Raise'],db:['Goblet Squat','Dumbbell Romanian Deadlift','Dumbbell Lunge','Dumbbell Hip Thrust','Calf Raise'],cool:'l'},
{t:['ไหล่ + หน้าท้อง','ไหล่ + หน้าท้อง'],bw:['Pike Push-up','Plank Up-Down','Plank','Bicycle Crunch','Leg Raise'],db:['Shoulder Press','Lateral Raise','Dumbbell Shrug','Plank','Bicycle Crunch'],cool:'u'},
{t:['ทั้งตัว','ทั้งตัว'],bw:['Squat','Push-up','Reverse Lunge','Superman','Mountain Climber'],db:['Goblet Squat','Dumbbell Floor Press','One-arm Dumbbell Row','Dumbbell Romanian Deadlift','Dumbbell Thruster'],cool:'f'}],
fat:[
{t:['HIIT ทั้งตัว','HIIT ทั้งตัว'],bw:['Burpee','High Knees','Jump Squat','Mountain Climber','Skater Jump'],db:['Dumbbell Thruster','High Knees','Goblet Squat','Mountain Climber','Skater Jump'],cool:'f'},
{t:['วงจรส่วนบน','วงจรส่วนบน'],bw:['Push-up','Pike Push-up','Bench Dip','Superman','Plank Up-Down'],db:['Dumbbell Floor Press','Shoulder Press','Bent-over Row','Bicep Curl','Tricep Extension'],cool:'u'},
{t:['คาร์ดิโอ + แกนกลาง','คาร์ดิโอ + แกนกลาง'],bw:['Jumping Jack','Butt Kicks','Bicycle Crunch','Russian Twist','Run in Place'],db:['Jumping Jack','Butt Kicks','Bicycle Crunch','Russian Twist','Run in Place'],cool:'f'},
{t:['HIIT ขา','HIIT ขา'],bw:['Jump Squat','Reverse Lunge','Skater Jump','High Knees','Glute Bridge'],db:['Goblet Squat','Dumbbell Lunge','Skater Jump','High Knees','Dumbbell Hip Thrust'],cool:'l'},
{t:['วงจรทั้งตัว','วงจรทั้งตัว'],bw:['Burpee','Push-up','Squat','Mountain Climber','Plank'],db:['Dumbbell Thruster','Dumbbell Floor Press','Dumbbell Romanian Deadlift','One-arm Dumbbell Row','Plank'],cool:'f'}],
strength:[
{t:['ขา (เน้นแรง)','ขา (เน้นแรง)'],bw:['Bulgarian Split Squat','Squat','Wall Sit','Glute Bridge'],db:['Goblet Squat','Dumbbell Romanian Deadlift','Dumbbell Lunge','Calf Raise'],cool:'l'},
{t:['ดัน (อก ไหล่ ไตรเซ็ปส์)','ดัน (อก ไหล่ ไตรเซ็ปส์)'],bw:['Decline Push-up','Pike Push-up','Diamond Push-up','Bench Dip'],db:['Dumbbell Floor Press','Shoulder Press','Decline Push-up','Tricep Extension'],cool:'u'},
{t:['ดึง (หลัง + แกนกลาง)','ดึง (หลัง + แขน)'],bw:['Superman','Reverse Fly','Bird Dog','Dead Bug'],db:['One-arm Dumbbell Row','Bent-over Row','Reverse Fly','Hammer Curl'],cool:'u'},
{t:['ล่าง + แกนกลาง','ล่าง + แกนกลาง'],bw:['Squat','Reverse Lunge','Plank','Side Plank','Leg Raise'],db:['Goblet Squat','Dumbbell Hip Thrust','Plank','Side Plank','Leg Raise'],cool:'l'},
{t:['ทั้งตัว (เน้นแรง)','ทั้งตัว (เน้นแรง)'],bw:['Squat','Push-up','Superman','Reverse Lunge','Plank'],db:['Goblet Squat','Dumbbell Floor Press','One-arm Dumbbell Row','Dumbbell Romanian Deadlift','Plank'],cool:'f'}],
};
const SUB={'Push-up':'Knee Push-up','Decline Push-up':'Knee Push-up','Diamond Push-up':'Knee Push-up','Burpee':'Jumping Jack','Jump Squat':'Squat','Bulgarian Split Squat':'Lunge','Plank Up-Down':'Plank','Leg Raise':'Dead Bug','Skater Jump':'Reverse Lunge','Dumbbell Thruster':'Goblet Squat'};
const COOL={u:['Shoulder Stretch',"Child's Pose"],l:['Quad Stretch','Hamstring Stretch','Hip Flexor Stretch'],f:["Child's Pose",'Hamstring Stretch','Shoulder Stretch']};
const X=k=>EX.find(e=>e[1].includes('('+k+')'));
const exIv=(k,sec,ci)=>{const e=X(k);return iv(e[1],sec,ci,e[2])};

function genDay(sel,d,idx,title){
  const [w,r,n]=GOALS[sel.goal].p[sel.level];
  let keys=d[sel.equip];
  if(sel.level==='beg')keys=[...new Set(keys.map(k=>SUB[k]||k))];
  const intervals=[];
  keys.forEach(k=>{intervals.push(exIv(k,w,1));intervals.push(iv('พัก',r,0))});
  const warmK=sel.level==='beg'?['Jumping Jack','Arm Circles','Squat']:['Jumping Jack','High Knees','Arm Circles','Squat'];
  return {id:'plan'+idx,name:WEEK[idx]+' · '+title,sets:n,intervals,
    warm:warmK.map(k=>exIv(k,30,3)),cool:COOL[d.cool].map(k=>exIv(k,30,5)),planDay:idx};
}
function genWeek(sel){
  return WEEK.map((day,i)=>{
    const di=WORK.indexOf(i);
    if(di<0)return {day,rest:true,note:i===3?'เดินเบาๆ 20–30 นาที หรือนอนพักให้เต็มที่':'ยืดเหยียดเบาๆ และเตรียมตัวสัปดาห์ใหม่'};
    const d=DAYS[sel.goal][di],title=d.t[sel.equip==='bw'?0:1];
    return {day,title,timer:genDay(sel,d,i,title)};
  });
}
function flatten(t){
  const main=[];for(let k=0;k<t.sets;k++)t.intervals.forEach(i=>main.push({...i}));
  return {id:uid(),name:t.name,sets:1,intervals:[...t.warm.map(x=>({...x})),...main,...t.cool.map(x=>({...x}))]};
}
let planSel=Object.assign({goal:'muscle',equip:'bw',level:'beg'},store.get('tp_plan',{}));
let done=store.get('tp_done',{}),curWeek=[];
const wkKey=()=>{const d=new Date(),m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return m.getFullYear()+'-'+(m.getMonth()+1)+'-'+m.getDate()};
const isDone=i=>!!done[wkKey()+'|'+i];
function markDone(i,v){
  const k=wkKey()+'|'+i;
  if(v)done[k]=1;else delete done[k];
  Object.keys(done).forEach(x=>{if(!x.startsWith(wkKey()+'|'))delete done[x]});
  store.set('tp_done',done);
}
const chips=(key,opts)=>'<div class="chiprow">'+opts.map(([v,l])=>`<button class="chip ${planSel[key]===v?'on':''}" data-k="${key}" data-v="${v}">${l}</button>`).join('')+'</div>';
function renderPlan(){
  curWeek=genWeek(planSel);
  const today=(new Date().getDay()+6)%7;
  const nDone=curWeek.filter((x,i)=>!x.rest&&isDone(i)).length;
  $('plan').innerHTML=
   `<div class="grp"><label class="l">เป้าหมาย</label>${chips('goal',Object.entries(GOALS).map(([k,g])=>[k,g.name]))}</div>
    <div class="grp"><label class="l">อุปกรณ์</label>${chips('equip',[['bw','น้ำหนักตัว'],['db','มีดัมเบล']])}</div>
    <div class="grp"><label class="l">ระดับ</label>${chips('level',[['beg','เริ่มต้น'],['int','เคยออกกำลังกายมาแล้ว']])}</div>
    <div class="meta" style="color:var(--mute);margin:12px 0 14px;font-size:.9rem">${GOALS[planSel.goal].desc}<br>ทำแล้ว ${nDone}/5 วันในสัปดาห์นี้ · กดชื่อวันเพื่อดูท่า</div>`+
   curWeek.map((x,i)=>{
     if(x.rest)return `<div class="card ${i===today?'today':''}" style="opacity:.75"><div class="info"><div class="name">${x.day} · พักผ่อน 😴</div><div class="meta">${x.note}</div></div></div>`;
     const t=x.timer,main=t.intervals.filter(v=>v.name!=='พัก');
     const list=main.map(v=>`<li>${esc(v.name)}${v.muscle?`<small>💪 ${esc(v.muscle)}</small>`:''}</li>`).join('')
       +`<li><small>วอร์มอัพ: ${t.warm.map(v=>esc(v.name.replace(/ \(.*\)/,''))).join(', ')}</small></li>`
       +`<li><small>คูลดาวน์: ${t.cool.map(v=>esc(v.name.replace(/ \(.*\)/,''))).join(', ')}</small></li>`;
     return `<div class="card ${i===today?'today':''}" data-i="${i}">
       <button class="chk ${isDone(i)?'on':''}" data-chk title="ทำแล้ว">${isDone(i)?'✓':''}</button>
       <div class="info"><details><summary><div class="name">${x.day} · ${esc(x.title)}</div>
         <div class="meta">${fmt(total(t))} นาที · ${main.length} ท่า × ${t.sets} รอบ</div></summary>
         <ul class="exl">${list}</ul><button class="sm" data-copy style="margin-top:8px">คัดลอกไปเป็นไทเมอร์ของฉัน</button></details></div>
       <button class="primary play" data-play>▶</button></div>`;
   }).join('');
}
$('plan').addEventListener('click',e=>{
  const c=e.target.closest('[data-k]');
  if(c){planSel[c.dataset.k]=c.dataset.v;store.set('tp_plan',planSel);renderPlan();return}
  const card=e.target.closest('.card[data-i]');if(!card)return;
  const i=+card.dataset.i,day=curWeek[i];
  if(e.target.closest('[data-chk]')){markDone(i,!isDone(i));renderPlan()}
  else if(e.target.closest('[data-play]'))startRun(day.timer);
  else if(e.target.closest('[data-copy]')){presets.push(flatten(day.timer));save();renderList();e.target.textContent='✓ คัดลอกแล้ว (ดูในแท็บไทเมอร์)';e.target.disabled=true}
});
function setTab(t){
  $('tabT').classList.toggle('on',t==='t');$('tabP').classList.toggle('on',t==='p');
  $('list').hidden=t!=='t';$('plan').hidden=t!=='p';$('btnNew').hidden=t!=='t';
  if(t==='p')renderPlan();
}
$('tabT').onclick=()=>setTab('t');$('tabP').onclick=()=>setTab('p');

renderList();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
